    <clipPath id="card"><rect x="292" y="330" width="440" height="430" rx="72"/></clipPath>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect width="1024" height="1024" fill="url(#glow)"/>
  <g transform="translate(512 512) scale(0.72) translate(-512 -512)">
  <!-- viewfinder -->
  <g fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" opacity="0.92">
    <path d="M190 330 V250 Q190 190 250 190 H330"/>
    <path d="M694 190 H774 Q834 190 834 250 V330"/>
    <path d="M834 694 V774 Q834 834 774 834 H694"/>
    <path d="M330 834 H250 Q190 834 190 774 V694"/>
  </g>

  <!-- calendar page -->
  <rect x="292" y="330" width="440" height="430" rx="72" fill="#fff"/>
  <rect x="292" y="330" width="440" height="118" fill="#3438C8" clip-path="url(#card)"/>
  <rect x="388" y="284" width="44" height="98" rx="22" fill="#fff"/>
  <rect x="592" y="284" width="44" height="98" rx="22" fill="#fff"/>

  <!-- the drop, landing -->
