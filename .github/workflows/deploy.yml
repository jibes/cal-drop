name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        # An unset repository variable arrives as an empty string, and an empty
        # VITE_PROXY_URL overrides the committed default with nothing — which
        # ships an app with no endpoint. Only export a value that is really set.
        run: |
          if [ -n "$ENDPOINT_OVERRIDE" ]; then
            export VITE_PROXY_URL="$ENDPOINT_OVERRIDE"
          fi
          npm run build
        env:
          # Optional override of the endpoint committed in .env.production.
          # A URL, not a secret — it is inlined into the public bundle either way.
          ENDPOINT_OVERRIDE: ${{ vars.VITE_PROXY_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
