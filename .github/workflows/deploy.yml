name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Non-secret defaults only. Anything set here is inlined into the
          # public JS bundle — never put an API key in these.
          VITE_AI_BASE_URL: ${{ vars.VITE_AI_BASE_URL }}
          VITE_AI_MODEL: ${{ vars.VITE_AI_MODEL }}
          VITE_AI_TEXT_MODEL: ${{ vars.VITE_AI_TEXT_MODEL }}
          VITE_CORS_PROXY: ${{ vars.VITE_CORS_PROXY }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
