name = "caldrop-endpoint"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Comma-separated list of allowed origins, or "*" to allow any.
# https://localhost and capacitor://localhost are the native app (cal-drop-app)
# on Android and iOS, which serve the same bundle from inside the app.
ALLOWED_ORIGINS = "https://jibes.github.io,https://localhost,capacitor://localhost"

# The OpenAI-compatible API this worker fronts.
UPSTREAM_URL = "https://api.melious.ai/v1"

# The one model this endpoint answers with. The app does not choose, and
# whatever it sends is discarded.
MODEL = "gemma-4-31b"

# Used only for requests that attach a picture. Leave unset to use MODEL for
# everything. gemma-4-31b is documented as multimodal but this API refuses
# every image encoding for it, and qwen2.5-vl-72b-instruct answers with a
# provider error, so photos go to the one the endpoint report found working.
VISION_MODEL = "gemma-3-27b-it"

# Euros per million tokens, from the provider's own pricing page. Only used to
# turn measured token counts into money in the endpoint report; nothing here
# changes what is sent or charged.
PRICE_IN = "0.10"
PRICE_OUT = "0.30"
PRICE_VISION_IN = "0.25"
PRICE_VISION_OUT = "0.50"

# Per-IP requests per day. This exists to stop a stranger who finds the URL
# from spending the operator's credits, not to ration the operator: one run of
# the endpoint report alone is a dozen or more requests.
DAILY_LIMIT = "200"

# Uncomment after `npx wrangler kv namespace create RATE_LIMIT` for a real,
# cross-isolate daily quota. Without it the limit is per-isolate only.
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "<namespace id>"
