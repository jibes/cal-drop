name = "caldrop-endpoint"
main = "worker.js"
compatibility_date = "2025-01-01"

[vars]
# Comma-separated list of allowed origins, or "*" to allow any.
ALLOWED_ORIGINS = "https://jibes.github.io"

# The OpenAI-compatible API this worker fronts.
UPSTREAM_URL = "https://api.melious.ai/v1"

# The one model this endpoint answers with. The app does not choose, and
# whatever it sends is discarded.
MODEL = "gemma-4-31b"

# Used only for requests that attach a picture. Leave unset to use MODEL for
# everything. gemma-4-31b is documented as multimodal but this API refuses
# every image encoding for it, so photos are routed to a model that works.
VISION_MODEL = "qwen2.5-vl-72b-instruct"

# Per-IP requests per day.
DAILY_LIMIT = "20"

# Uncomment after `npx wrangler kv namespace create RATE_LIMIT` for a real,
# cross-isolate daily quota. Without it the limit is per-isolate only.
# [[kv_namespaces]]
# binding = "RATE_LIMIT"
# id = "<namespace id>"
